name: bilibili-links

on:
  schedule:
    # 每周一 03:00 UTC 检查一次第三方搬运链接
    - cron: "0 3 * * 1"
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verify Bilibili links
        run: python scripts/verify_bilibili.py
