name: build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Rebuild docs
        run: python scripts/build.py

      - name: Validate
        run: python scripts/check.py

      - name: Check generated files are committed
        run: git diff --exit-code
